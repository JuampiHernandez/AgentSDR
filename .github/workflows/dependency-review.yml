name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # MIT project: refuse source-available licences that would restrict what users of AgentSDR may do.
          # Only valid SPDX ids: "Commons-Clause" is not one, and the action errored on every PR with it listed.
          deny-licenses: SSPL-1.0, BUSL-1.1
          comment-summary-in-pr: on-failure
